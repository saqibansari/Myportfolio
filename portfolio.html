  <script src="script.js"></script>
  <script>
    (function(){
      document.querySelectorAll('.project-card').forEach(card => {
        card.addEventListener('click', () => {
          const target = card.dataset.target;
          const firstMedia = document.querySelector(`#${target} .project-gallery img, #${target} .project-gallery video`);
          if(firstMedia){ firstMedia.click(); }
        });
        card.addEventListener('keydown', event => {
          if(event.key === 'Enter' || event.key === ' '){
            event.preventDefault();
            card.click();
          }
        });
      });
    })();

    /* ── Gallery zoom ───────────────────────────────────────────── */
    (function(){
      const overlay    = document.querySelector('.gallery-overlay');
      const frame      = overlay?.querySelector('.gallery-frame');
      const zoomIn     = document.getElementById('gallery-zoom-in');
      const zoomOut    = document.getElementById('gallery-zoom-out');
      const zoomReset  = document.getElementById('gallery-zoom-reset');
      if(!overlay || !frame || !zoomIn || !zoomOut || !zoomReset) return;

      const STEP = 0.2, MIN = 1, MAX = 4;
      let scale = 1, panX = 0, panY = 0;
      let isPanning = false, startX = 0, startY = 0;

      const getTarget = () => frame.querySelector('.gallery-image:not([hidden]), .gallery-video:not([hidden])');

      const setCursor = (value) => {
        const el = getTarget();
        if(el) el.style.cursor = value;
        frame.style.cursor = value;
      };

      /* clamp pan so scaled image never leaves the frame.
         offsetWidth/offsetHeight are layout dimensions unaffected by
         CSS transform, so we avoid double-counting the scale factor. */
      const clampPan = () => {
        const el = getTarget();
        if(!el || scale <= 1){ panX = 0; panY = 0; return; }
        const fr   = frame.getBoundingClientRect();
        const maxX = Math.max(0, (el.offsetWidth  * scale - fr.width)  / 2);
        const maxY = Math.max(0, (el.offsetHeight * scale - fr.height) / 2);
        panX = Math.min(maxX, Math.max(-maxX, panX));
        panY = Math.min(maxY, Math.max(-maxY, panY));
      };

      const applyTransform = () => {
        const el = getTarget();
        if(!el) return;
        clampPan();
        el.style.transition = isPanning ? 'none' : 'transform .2s ease';
        el.style.transform = `scale(${scale}) translate(${panX/scale}px, ${panY/scale}px)`;
        setCursor(scale > 1 ? 'grab' : 'default');
      };

      const resetZoom = () => {
        scale = 1; panX = 0; panY = 0;
        applyTransform();
      };

      /* called whenever a new image/video is loaded so zoom resets */
      const patchUpdateGallery = () => {
        const orig = window._galleryZoomPatchDone;
        if(orig) return;
        window._galleryZoomPatchDone = true;
        const observer = new MutationObserver(() => resetZoom());
        observer.observe(frame, { childList: false, subtree: true, attributes: true, attributeFilter: ['src','hidden'] });
      };
      patchUpdateGallery();

      zoomIn.addEventListener('click',    () => { scale = Math.min(MAX, +(scale + STEP).toFixed(2)); applyTransform(); });
      zoomOut.addEventListener('click',   () => { scale = Math.max(MIN, +(scale - STEP).toFixed(2)); if(scale===MIN){panX=0;panY=0;} applyTransform(); });
      zoomReset.addEventListener('click', () => resetZoom());

      /* mouse-wheel zoom */
      frame.addEventListener('wheel', e => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? STEP : -STEP;
        scale = Math.min(MAX, Math.max(MIN, +(scale + delta).toFixed(2)));
        if(scale === MIN){ panX = 0; panY = 0; }
        applyTransform();
      }, { passive: false });

      /* keyboard + / - / 0 */
      document.addEventListener('keydown', e => {
        if(!overlay.classList.contains('active')) return;
        if(e.key === '+' || e.key === '=') { scale = Math.min(MAX, +(scale+STEP).toFixed(2)); applyTransform(); }
        if(e.key === '-')                  { scale = Math.max(MIN, +(scale-STEP).toFixed(2)); if(scale===MIN){panX=0;panY=0;} applyTransform(); }
        if(e.key === '0')                  { resetZoom(); }
      });

      /* drag to pan when zoomed */
      frame.addEventListener('mousedown', e => {
        if(scale <= 1) return;
        e.preventDefault(); /* block native browser image drag */
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        setCursor('grabbing');
      });
      window.addEventListener('mousemove', e => {
        if(!isPanning) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        applyTransform();
      });
      window.addEventListener('mouseup', () => {
        if(!isPanning) return;
        isPanning = false;
        setCursor(scale > 1 ? 'grab' : 'default');
      });

      /* pinch-to-zoom on touch */
      let lastDist = null;
      frame.addEventListener('touchmove', e => {
        if(e.touches.length !== 2) return;
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        if(lastDist !== null){
          const ratio = dist / lastDist;
          scale = Math.min(MAX, Math.max(MIN, +(scale * ratio).toFixed(2)));
          applyTransform();
        }
        lastDist = dist;
      }, { passive: false });
      frame.addEventListener('touchend', () => { lastDist = null; });

      /* reset zoom whenever gallery opens */
      new MutationObserver(muts => {
        muts.forEach(m => {
          if(m.attributeName === 'aria-hidden' && overlay.getAttribute('aria-hidden') === 'false') resetZoom();
        });
      }).observe(overlay, { attributes: true, attributeFilter: ['aria-hidden'] });
    })();
  </script>
</body>
</html>
