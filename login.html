<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PMPCG9T2CV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-PMPCG9T2CV');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      font-family: Roboto, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6fb;
      color: #1f2937;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, rgba(59, 130, 246, 0.15), transparent 30%),
                  linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
    }
    .login-shell {
      width: min(420px, calc(100% - 32px));
      padding: 36px 32px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }
    .login-shell h1 {
      margin: 0 0 10px;
      font-size: clamp(1.75rem, 2vw, 2.25rem);
      letter-spacing: -0.03em;
    }
    .login-shell p {
      margin: 0 0 28px;
      color: #475569;
      line-height: 1.7;
    }
    .form-control {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }
    label {
      font-size: 0.92rem;
      font-weight: 600;
      color: #334155;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-size: 1rem;
      color: #0f172a;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.14);
      background: #ffffff;
    }
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .actions a {
      font-size: 0.95rem;
      color: #3b82f6;
      text-decoration: none;
    }
    .actions a:hover {
      text-decoration: underline;
    }
    button {
      width: 100%;
      padding: 14px 18px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 28px rgba(59, 130, 246, 0.22);
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
      box-shadow: none;
    }
    .feedback {
      min-height: 24px;
      font-size: 0.95rem;
      color: #ef4444;
      opacity: 0;
      transition: opacity 180ms ease;
    }
    .feedback.visible {
      opacity: 1;
    }
    .pyramid-shell {
      margin-top: 24px;
      padding: 18px 22px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }
    .pyramid-shell h2 {
      margin: 0 0 14px;
      font-size: 1.05rem;
      color: #0f172a;
    }
    .pyramid-shell pre {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.92rem;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      color: #1f2937;
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <h1>Welcome back</h1>
    <p>Sign in to your account to continue to your dashboard.</p>

    <form id="loginForm" autocomplete="on">
      <div class="form-control">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required />
      </div>

      <div class="form-control">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password" required minlength="8" />
      </div>

      <div class="actions">
        <label>
          <input id="remember" name="remember" type="checkbox" /> Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit">Sign in</button>
      <div id="feedback" class="feedback"></div>
    </form>
  </main>

  <section class="pyramid-shell">
    <h2>Number Pyramid (1 to 99)</h2>
    <pre id="pyramidOutput" aria-label="Number pyramid"></pre>
  </section>

  <script>
    const form = document.getElementById('loginForm');
    const feedback = document.getElementById('feedback');
    const pyramidOutput = document.getElementById('pyramidOutput');

    function createNumberPyramid(maxNumber = 99) {
      const rows = [];
      let current = 1;
      let rowLength = 1;

      while (current <= maxNumber) {
        const rowNumbers = [];
        for (let i = 0; i < rowLength && current <= maxNumber; i += 1) {
          rowNumbers.push(current);
          current += 1;
        }
        rows.push(rowNumbers.join(' '));
        rowLength += 1;
      }

      return rows.join('\n');
    }

    function renderPyramid() {
      pyramidOutput.textContent = createNumberPyramid(99);
    }

    renderPyramid();

    form.addEventListener('submit', event => {
      event.preventDefault();
      const email = form.email.value.trim();
      const password = form.password.value;

      if (!email || !password) {
        feedback.textContent = 'Please enter both email and password.';
        feedback.classList.add('visible');
        return;
      }

      feedback.textContent = 'Signing in...';
      feedback.style.color = '#2563eb';
      feedback.classList.add('visible');

      setTimeout(() => {
        const validEmail = email.toLowerCase() === 'user@example.com' && password === 'password123';
        if (validEmail) {
          feedback.textContent = 'Login successful! Redirecting...';
          feedback.style.color = '#16a34a';
        } else {
          feedback.textContent = 'Invalid credentials. Please try again.';
          feedback.style.color = '#ef4444';
        }
      }, 800);
    });
  </script>
</body>
</html>
